name: Crypto Scan
on: [pull_request]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for git diff
      - uses: Plothner/firewall-action@v1
        with:
          backend_url: https://qryptera-api.plothner.com
          github_token: ${{ secrets.GITHUB_TOKEN }}
